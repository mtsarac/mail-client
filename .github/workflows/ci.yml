name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight gate: master requires the build-test and format checks, so this
  # workflow must run on every push/PR. Expensive jobs below are skipped (which
  # counts as passing for required checks) when no backend-relevant file changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.editorconfig'

  build-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/MailClient.slnx

      - name: Build (Release, no restore)
        run: dotnet build backend/MailClient.slnx --configuration Release --no-restore

      - name: Audit NuGet vulnerabilities (transitive included)
        run: |
          set -o pipefail
          dotnet list backend/MailClient.slnx package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages detected (see audit above)."
            exit 1
          fi

      - name: Test (Release, no build)
        run: dotnet test backend/MailClient.slnx --configuration Release --no-build --verbosity normal

  format:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting
        run: dotnet format backend/MailClient.slnx --verify-no-changes
